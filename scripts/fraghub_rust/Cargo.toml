[package]
name = "fraghub_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "fraghub_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.2", features = ["extension-module"] }
csv = "1.3"
rayon = "1.10.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"
once_cell = "1.19" # <--- Ajoute ceci !
sha2 = "0.10.8" # <-- AJOUTER CECI
hex = "0.4.3"   # <-- AJOUTER CECI
chrono = "0.4.45"

